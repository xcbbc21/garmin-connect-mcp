name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run tests with coverage
      run: npm run test:coverage
      
    - name: Build
      run: npm run build

    - name: Verify package contents
      if: matrix.node-version == '22.x'
      run: npm run pack:smoke

  windows-session-acl:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Verify Windows owner-only session writes
      run: npm test -- --runInBand tests/windows-private-acl.test.ts

    - name: Build host runtime
      run: npm run build:host

  macos-session-acl:
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Verify macOS owner-only session writes and ACLs
      run: npm test -- --runInBand tests/darwin-private-acl.test.ts tests/session-store-write.test.ts tests/session-store.test.ts

    - name: Build host runtime
      run: npm run build:host
