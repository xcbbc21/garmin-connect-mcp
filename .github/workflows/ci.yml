name: CI

on:
  push:
    branches: ["main", "refactor/universal-mcp"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run pack:smoke
      - name: Install packed runtime without development dependencies
        run: npm run test:distribution

  platform-runtime:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - os: windows-latest
            acl-tests: tests/windows-private-acl.test.ts
          - os: macos-latest
            acl-tests: tests/darwin-private-acl.test.ts tests/session-store-write.test.ts tests/session-store.test.ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Verify platform permissions, command startup and stdio protocol
        run: npm test -- --runInBand ${{ matrix.acl-tests }} tests/stdio.test.ts tests/scripts.test.ts tests/index.test.ts
      # The journal, the account lock and the recovery entry points are the
      # parts most likely to behave differently per platform: private paths,
      # atomic rename, DACL/ACL enforcement, lock-worker spawn and exit, and
      # the bytes a killed stdio peer leaves behind. They are part of the core
      # matrix, so they run here as well rather than only on Linux.
      - name: Verify write journal, account lock and recovery across platforms
        run: npm test -- --runInBand tests/write-operation-store.test.ts tests/write-operation-lock.test.ts tests/write-operation-migration.test.ts tests/write-state-security.test.ts tests/write-stdio-recovery.test.ts tests/stdio-protocol.test.ts
      - run: npm run pack:smoke
      - run: npm run test:distribution
