title: dsh-plugin-garmin-connect
description: 在 AI 助手中安全查询和分析 Garmin Connect 数据
url: https://gc.li2niu.com
baseurl: ""
theme: jekyll-theme-cayman
show_downloads: false

plugins:
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: true

exclude:
  - node_modules
  - lib
  - coverage
  - dist
  - src
  - tests
  - scripts
  - skills
  - docs/research
  - .github
  - package.json
  - package-lock.json
  - tsconfig.json
  - tsconfig.client.json
  - jest.config.js
  - cordis.patch.yml
